name: Diagnostico temporal Devoluciones

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr el diagnostico (SOLO LECTURA contra la API de ML)
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python scripts/diagnostico_devoluciones.py

      - name: Guardar diagnostico.json si cambio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add diagnostico.json
          git diff --staged --quiet || git commit -m "Actualiza diagnostico.json"
          git push
