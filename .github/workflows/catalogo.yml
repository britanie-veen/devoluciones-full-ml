name: Sincronizar catálogo Odoo

on:
  schedule:
    - cron: "0 * * * *"        # cada hora (UTC)
  workflow_dispatch: {}        # botón "Run workflow" para forzar

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer Odoo y regenerar catalogo.json
        env:
          ODOO_URL:     ${{ secrets.ODOO_URL }}
          ODOO_DB:      ${{ secrets.ODOO_DB }}
          ODOO_USER:    ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python scripts/sync_catalogo.py

      - name: Commit si cambió
        run: |
          if git diff --quiet -- catalogo.json; then
            echo "Sin cambios, nada que subir."
            exit 0
          fi
          git config user.name  "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add catalogo.json
          git commit -m "Catálogo Odoo $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
